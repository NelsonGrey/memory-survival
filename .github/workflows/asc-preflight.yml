name: ASC preflight

# Read-only check of the live App Store Connect record against this
# repository: listing text and screenshots, categories and age rating, review
# contact, price and availability, the Unlock Premium purchase, Game Center
# and the build. See packages/mobile/scripts/asc_preflight.py.
#
# Run it any time from the Actions tab. It also runs weekly so drift (a field
# edited in the console, an expired build) is caught before a release.

on:
  workflow_dispatch:
    inputs:
      require_attached_build:
        description: Fail (not warn) when no build is attached to the version
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 14 * * 1'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyjwt cryptography
      - name: Check App Store Connect
        run: |
          python3 packages/mobile/scripts/asc_preflight.py ${{ inputs.require_attached_build && '--require-attached-build' || '' }}
